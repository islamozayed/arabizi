[package]
name = "franconvert"
version = "0.9.3"
edition = "2024"

[dependencies]
arabizi-engine = { path = "../engine" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.2"
window-vibrancy = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSTextCheckingClient"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebViewConfiguration", "objc2-app-kit"] }

# Windows-only deps
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
