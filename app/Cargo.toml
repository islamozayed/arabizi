[package]
name = "franconvert"
version = "0.9.4"
edition = "2024"
description = "Type Franco Arabic, get Arabic script — a tray widget with a native UI on each platform."
license = "MIT"

[features]
# Scripted UI driver for screenshot comparisons (never in releases).
drive = []

[dependencies]
franconvert-core = { path = "../core" }
serde_json = "1"
# Updater: fetch latest.json, verify the minisign signature, unpack.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
minisign-verify = "0.3"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
semver = "1"
global-hotkey = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-quartz-core = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
